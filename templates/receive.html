{% extends "base.html" %}{% block content %}<h1>Receive money</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Sender country<select name="country">{% for name,c in countries.items() %}<option value="{{name}}">{{name}} — {{c.currency}}</option>{% endfor %}</select></label><label>Expected amount<input type="number" name="amount" step="0.01" min="1" required></label><button>Create secure transaction</button></form><div class="notice">Receiving bank details remain disabled until the regulated partner is connected.</div>{% endblock %}
