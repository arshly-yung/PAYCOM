{% extends 'base.html' %}{% block content %}<h1>Receive money</h1><p>Create a transaction first. The admin will send receiving bank details specifically to it.</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Sender country<select name="country">{% for n,c in countries.items() %}<option value="{{n}}">{{n}} — {{c.currency}}</option>{% endfor %}</select></label><label>Expected amount<input type="number" name="amount" min="1" step="0.01" required></label><button>Create transaction</button></form>{% endblock %}
