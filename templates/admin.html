<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay.com Admin</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><div class="admin"><h1>Pay.com Operations</h1><h2>Users</h2><table><tr><th>Name</th><th>Phone</th><th>Verified</th><th>Action</th></tr>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.phone}}</td><td>{{u.is_verified}}</td><td>{% if not u.is_verified %}<form method="post" action="{{url_for('admin_verify_user',user_id=u.id)}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Verify</button></form>{% endif %}</td></tr>{% endfor %}</table><h2>Transactions</h2><table><tr><th>Ref</th><th>User</th><th>Route</th><th>Status</th><th>Update</th></tr>{% for t in txns %}<tr><td>{{t.reference}}</td><td>{{t.user.full_name}}</td><td>{{t.country}}</td><td>{{t.status}}</td><td><form method="post" action="{{url_for('admin_update_status',tx_id=t.id)}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="status">{% for s in ['CREATED','WAITING_FOR_PAYMENT','RECEIPT_UPLOADED','PAYMENT_VERIFIED','PAYOUT_PROCESSING','COMPLETED','ON_HOLD','FAILED','CANCELLED'] %}<option {{'selected' if s==t.status else ''}}>{{s}}</option>{% endfor %}</select><button>Save</button></form></td></tr>{% endfor %}</table></div></body></html>
